# Fork only: the chart's CI steps on each of the two split commits. Not for upstream.
name: Split verify (fork)
on:
  push:
    branches: [split-verify]
permissions:
  contents: read
jobs:
  chart-ci:
    strategy:
      fail-fast: false
      matrix:
        sha: [2a562e21e1d9ec194fe075dc74306a37bcba5c27, ae02b55818a34cd4135e4f2ebf03a62f11d19f27]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: azure/setup-helm@v4
        with:
          version: v3.13.1
      - run: helm plugin install --version 1.0.2 https://github.com/helm-unittest/helm-unittest
      - run: |
          helm repo add cpa https://kubernetes-sigs.github.io/cluster-proportional-autoscaler
          helm repo update
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: helm/chart-testing-action@v2.8.0
      - run: |
          git log -1 --oneline
          git remote add upstream https://github.com/coredns/helm
          git fetch -q upstream master
          helm unittest --strict charts/coredns
          ct lint --remote upstream --target-branch master
      - uses: helm/kind-action@v1.15.0
      - run: ct install --remote upstream --target-branch master
