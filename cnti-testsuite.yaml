---
# CNTi Test Suite configuration for the CoreDNS chart in this repository.
config_version: "v2"
common:
  container_names:
    # Retained image tags used by the rolling update, downgrade and rollback
    # tests; the chart's appVersion is the tag under test.
    - name: coredns
      rolling_update_test_tag: "1.14.4"
      rolling_downgrade_test_tag: "1.13.2"
      rolling_version_change_test_tag: "1.14.4"
      rollback_from_tag: "1.14.4"
deployments:
  helm_dirs:
    - name: coredns
      helm_directory: charts/coredns
      namespace: coredns-cnti
      helm_values: --values ci/cnti-values.yaml
